<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JavaScript Tutorial</title>

  <!-- Bootstrap (as used in the lecture example, Step 0) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <style>
    body {
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
    }

    section {
      margin: 20px;
    }

    label {
      margin-left: 10px;
    }

    #mylist {
      text-align: left;
      width: 400px;
      margin: 0 auto;
      border: 1px dashed;
      padding: 1%;
      cursor: pointer;
    }

    /* keeps the layout usable if Bootstrap is not reachable offline */
    #form .input-group {
      width: 400px;
      margin: 0 auto;
      display: flex;
    }

    #form input[type="text"] {
      flex: 1;
      padding: 8px;
    }
  </style>
</head>

<body>
  <section>

    <!-- ============ Step 0: HTML structure ============ -->
    <section id="form">
      <h1>My Todo Application</h1>
      <div class="input-group">
        <input class="form-control" type="text" name="item"
               placeholder="What would you like to add?">
        <button class="btn btn-primary" id="addBtn">+</button>
      </div>
    </section>

    <!-- the items added by the user are inserted here by the DOM -->
    <section id="mylist"></section>

    <section id="clear">
      <button class="btn btn-danger" id="clearBtn">Clear List</button>
    </section>

  </section>

  <script>
    /* ==========================================================
       CCSW321 - JavaScript for Web Development (Part 5.1)
       Task 1 : DOM / Events example  (Slides 34 - 38)
       ========================================================== */

    /* ---------- Selecting the DOM elements ---------- */
    const addButton   = document.getElementById('addBtn');
    const clearButton = document.getElementById('clearBtn');
    const userInput   = document.getElementsByName('item')[0];
    const myList      = document.getElementById('mylist');

    /* ---------- Step 1: add the item on mouse click ---------- */
    addButton.addEventListener('click', addElement);

    /* ---------- Step 2: add the item when 'Enter' is pressed ---------- */
    userInput.addEventListener('keypress', function (event) {
      if (event.key === 'Enter') {
        addElement();
      }
    });

    /* ---------- Step 3: empty the whole list on mouse click ---------- */
    clearButton.addEventListener('click', emptyList);

    /* ---------- Step 4: read the user input and add it to the list ---------- */
    function addElement() {

      const text = userInput.value.trim();

      // presence check: do not add empty items
      if (text.length < 1) {
        userInput.focus();
        return;
      }

      // create one row:  [ checkbox ]  item text
      const row      = document.createElement('div');
      const checkbox = document.createElement('input');
      const label    = document.createElement('label');

      checkbox.type      = 'checkbox';
      label.textContent  = text;

      // event listener on the new element: remove the item when checked
      checkbox.addEventListener('click', function () {
        row.remove();
      });

      row.appendChild(checkbox);
      row.appendChild(label);
      myList.appendChild(row);

      // reset the input box, ready for the next item
      userInput.value = '';
      userInput.focus();
    }

    /* ---------- Step 5: remove all the items from the list ---------- */
    function emptyList() {
      myList.innerHTML = '';
      userInput.focus();
    }
  </script>
</body>

</html>
